name: Service request
description: Request a quote for a Codex workflow setup, small automation, code repair, or prototype task.
title: "[Quote] "
body:
  - type: markdown
    attributes:
      value: |
        Share only sanitized examples. Do not post credentials, private customer data, payment details, production secrets, or files that you are not allowed to share. Do not request CAPTCHA bypass, account automation, spam, fake engagement, or platform-rule bypass work.

        This public issue is for sanitized pre-scope only. If the task fits, I reply with a fixed scope, price, timeline, and platform-native payment path. Work starts after payment. Private repo or data access is handled only after fixed-scope agreement and payment, if needed.

        Sample deliverables:
        - AI app rescue audit: https://xyjk0511.github.io/codex-services-portfolio/cases/ai-app-rescue-sample-report.html
        - PR review / bug rescue report: https://xyjk0511.github.io/codex-services-portfolio/cases/pr-review-sample.html
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the audit, script, patch, or prototype do?
      placeholder: Make this repo safer for Codex changes, or compare two CSV exports and produce a mismatch report.
    validations:
      required: true
  - type: dropdown
    id: service_type
    attributes:
      label: Preferred fixed package
      options:
        - CSV / Excel script or repair ($50-$150)
        - Bug / CI triage ($79)
        - Repo readiness audit ($99)
        - One-flow code rescue ($199+)
        - Codex workflow setup ($249)
        - CI / PR verification workflow ($499)
        - AI workflow audit ($99)
        - Small AI / RAG prototype ($250+)
        - Other small fixed-scope task
    validations:
      required: true
  - type: dropdown
    id: budget
    attributes:
      label: Budget / package confirmation
      options:
        - $9-$19 self-serve CSV kit support question
        - $50-$150 script or repair
        - $79 bug / CI triage
        - $99 audit
        - $199+ one-flow rescue or cleanup sprint
        - $249 Codex workflow setup
        - $499 CI / PR verification workflow
        - $250+ prototype
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample, repo link, failing command, or expected output
      description: Paste a tiny fake-data example, public repo link, failing command, or the desired output. Do not post secrets or private production data.
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: Public repo URL, or say private/not public if you only want a readiness checklist.
      placeholder: https://github.com/org/repo
    validations:
      required: false
  - type: textarea
    id: failing_commands
    attributes:
      label: Current commands or failure
      description: Paste the failing test/lint/build command and the shortest useful error excerpt.
      placeholder: npm test fails in packages/app/src/foo.test.ts
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What proof would make this job done?
      placeholder: The failing test passes, npm run build passes, and the README explains the command.
    validations:
      required: false
  - type: input
    id: deadline
    attributes:
      label: Deadline
      description: When do you need a first result?
      placeholder: No hard deadline / by Friday / within 1 week
    validations:
      required: false
  - type: checkboxes
    id: deliverables
    attributes:
      label: Expected deliverables
      options:
        - label: Runnable script or small tool
        - label: Patch or pull request
        - label: README / setup notes
        - label: Sample output or verification notes
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Deadline, platform, file type, language, budget range, or no-go requirements.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private customer data, payment details, production secrets, and files I am not allowed to share.
          required: true
